<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Postorder Tree Traversal — EngMap Animation</title>
<style>

* { box-sizing: border-box; }
:root {
  --bg:#0a0d13;
  --panel:#111826;
  --border:#273247;
  --text:#eef3f8;
  --muted:#8795a8;
  --blue:#60a5fa;
  --amber:#f59e0b;
  --green:#34d399;
}
body {
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  display:flex;
  justify-content:center;
  padding:24px 14px 40px;
}
.wrap { width:min(1040px, 100%); }
h1 {
  margin:0 0 6px;
  font-size:clamp(1.55rem, 3vw, 2.15rem);
  letter-spacing:-.03em;
}
.sub {
  margin:0 0 16px;
  color:var(--muted);
  font-size:.96rem;
}
.sub strong { color:#fff; }
.card {
  background:#0f151f;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 28px 80px rgba(0,0,0,.35);
}
.controls {
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  background:#111925;
}
button {
  border:1px solid #344158;
  background:#1a2432;
  color:#dce5f0;
  border-radius:9px;
  padding:8px 13px;
  font-weight:800;
  cursor:pointer;
}
button:hover { background:#222f40; }
button.primary {
  background:#223b72;
  border-color:#365a9e;
  color:#c9d8ff;
}
.speed-wrap {
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border:1px solid #2d3b50;
  border-radius:10px;
  background:#0f1722;
  color:#9fb0c5;
  font:800 .76rem ui-monospace, monospace;
}
.speed-wrap label { color:#c8d5e4; }
.speed-wrap select {
  background:#172131;
  color:#e6edf7;
  border:1px solid #344158;
  border-radius:8px;
  padding:6px 8px;
  font:800 .76rem ui-monospace, monospace;
  outline:none;
}
.spacer { flex:1; }
.readout {
  font:800 .76rem ui-monospace, monospace;
  color:#95a2b5;
}
.readout b { color:#fff; }

.stage {
  position:relative;
  min-height:640px;
  background:
    radial-gradient(circle at 50% 15%, rgba(96,165,250,.09), transparent 24%),
    #080c12;
  padding:76px 18px 18px;
  overflow:hidden;
}
.banner {
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:10px 18px;
  border-radius:999px;
  border:1px solid #33445c;
  background:#121b27;
  color:#e4ecf5;
  font:900 .82rem ui-monospace, monospace;
  letter-spacing:.03em;
  white-space:nowrap;
  box-shadow:0 8px 25px rgba(0,0,0,.24);
}
.banner.visit { border-color:#86621c; background:#21190a; color:#ffd98a; }
.banner.go { border-color:#355b35; background:#0f1a11; color:#a6f0bf; }
.banner.back { border-color:#365a9e; background:#121a29; color:#cddcff; }
.banner.done { border-color:#276348; background:#0f2018; color:#96ecc6; }

.panel {
  background:#111926;
  border:1px solid #28354a;
  border-radius:16px;
  padding:16px;
  min-width:0;
}
.plot-panel {
  display:flex;
  flex-direction:column;
  gap:12px;
}
.plot-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.plot-title {
  font:900 .92rem ui-monospace, monospace;
  color:#dbe7f4;
}
.chips {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.chip {
  padding:6px 10px;
  border-radius:999px;
  border:1px solid #314156;
  background:#0d141d;
  color:#9eb0c7;
  font:800 .72rem ui-monospace, monospace;
}
.chip strong { color:#fff; }

.plot-wrap {
  position:relative;
  background:#091018;
  border:1px solid #29374b;
  border-radius:14px;
  overflow:hidden;
  min-height:500px;
}
svg { width:100%; height:100%; display:block; }

.tree-edge {
  stroke:#42546e;
  stroke-width:3;
  transition:.25s ease;
}
.tree-edge.active {
  stroke:var(--amber);
  stroke-width:4;
  filter:drop-shadow(0 0 6px rgba(245,158,11,.35));
}
.tree-node circle {
  fill:#111926;
  stroke:#355c86;
  stroke-width:2.5;
  transition:.25s ease;
}
.tree-node text {
  fill:#eaf1f8;
  font:900 18px ui-monospace, monospace;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
}
.tree-node.idle circle { stroke:#355c86; fill:#111926; }
.tree-node.current circle {
  fill:#21190a;
  stroke:var(--amber);
  stroke-width:3.2;
  filter:drop-shadow(0 0 10px rgba(245,158,11,.35));
}
.tree-node.visited circle {
  fill:#102018;
  stroke:var(--green);
  stroke-width:3;
}
.tree-node.pending circle {
  fill:#101b2c;
  stroke:var(--blue);
  stroke-width:2.8;
}

.output-strip {
  background:#0b1119;
  border:1px solid #2b394c;
  border-radius:12px;
  padding:12px;
  min-height:86px;
}
.output-title {
  font:900 .75rem ui-monospace, monospace;
  color:#9fb0c5;
  margin-bottom:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.output-nodes {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.out-node {
  min-width:38px;
  padding:8px 10px;
  border-radius:10px;
  background:#132131;
  border:1px solid #355c86;
  color:#d7e9ff;
  text-align:center;
  font:900 .85rem ui-monospace, monospace;
  transition:.2s ease;
}
.out-node.latest {
  background:#21190a;
  border-color:#9a6d20;
  color:#ffe1a1;
  box-shadow:0 0 18px rgba(245,158,11,.18);
}
.phase-note {
  min-height:28px;
  color:#91a0b4;
  font-size:.9rem;
  line-height:1.45;
  text-align:center;
}
@media (max-width: 640px) {
  .banner { white-space:normal; text-align:center; max-width:92%; }
}

</style>
</head>
<body>
<div class="wrap">
  <h1>Postorder Tree Traversal</h1>
  <p class="sub"><strong>Postorder</strong> visits nodes in this order: <strong>Left → Right → Root</strong>.</p>

  <div class="card">
    <div class="controls">
      <button class="primary" id="playBtn">▶ Play</button>
      <button id="stepBtn">Step</button>
      <button id="resetBtn">Reset</button>
      <div class="speed-wrap">
        <label for="speedSelect">Speed</label>
        <select id="speedSelect">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
          <option value="3">3×</option>
        </select>
      </div>
      <div class="spacer"></div>
      <div class="readout">Step: <b id="stepNo">0</b>/<b id="totalSteps">0</b> · Output size: <b id="outCount">0</b> · Speed: <b id="speedReadout">1×</b></div>
    </div>

    <div class="stage">
      <div class="banner" id="banner">Press Play</div>

      <div class="panel plot-panel">
        <div class="plot-head">
          <div class="plot-title">Binary tree</div>
          <div class="chips">
            <div class="chip">Traversal = <strong>Postorder</strong></div>
            <div class="chip">Rule = <strong>Left → Right → Root</strong></div>
            <div class="chip" id="phaseChip">Phase = <strong>Idle</strong></div>
          </div>
        </div>

        <div class="plot-wrap">
          <svg viewBox="0 0 900 460" aria-label="Postorder Tree Traversal animation">
            <g id="edgeLayer"></g>
            <g id="nodeLayer"></g>
          </svg>
        </div>

        <div class="output-strip">
          <div class="output-title">Traversal output</div>
          <div class="output-nodes" id="outputNodes"></div>
        </div>

        <div class="phase-note" id="phaseNote">Left → Right → Root</div>
      </div>
    </div>
  </div>
</div>

<script>

const NODES = {
  A:{x:450,y:60,left:'B',right:'C'},
  B:{x:250,y:150,left:'D',right:'E'},
  C:{x:650,y:150,left:'F',right:'G'},
  D:{x:150,y:255,left:'H',right:'I'},
  E:{x:350,y:255,left:'J',right:'K'},
  F:{x:550,y:255,left:'L',right:'M'},
  G:{x:750,y:255,left:'N',right:'O'},
  H:{x:100,y:375,left:null,right:null},
  I:{x:200,y:375,left:null,right:null},
  J:{x:300,y:375,left:null,right:null},
  K:{x:400,y:375,left:null,right:null},
  L:{x:500,y:375,left:null,right:null},
  M:{x:600,y:375,left:null,right:null},
  N:{x:700,y:375,left:null,right:null},
  O:{x:800,y:375,left:null,right:null}
};
const EDGES = [
  ['A','B'], ['A','C'],
  ['B','D'], ['B','E'], ['C','F'], ['C','G'],
  ['D','H'], ['D','I'], ['E','J'], ['E','K'],
  ['F','L'], ['F','M'], ['G','N'], ['G','O']
];

const STEPS = [{"node": "H", "path": ["A", "B", "D", "H"], "edge": ["D", "H"], "note": "Visit H after reaching the leftmost leaf.", "index": 1}, {"node": "I", "path": ["A", "B", "D", "I"], "edge": ["D", "I"], "note": "Visit I next; both children of D are now done.", "index": 2}, {"node": "D", "path": ["A", "B", "D"], "edge": ["B", "D"], "note": "Now visit D after both H and I.", "index": 3}, {"node": "J", "path": ["A", "B", "E", "J"], "edge": ["E", "J"], "note": "Visit J.", "index": 4}, {"node": "K", "path": ["A", "B", "E", "K"], "edge": ["E", "K"], "note": "Visit K; both children of E are done.", "index": 5}, {"node": "E", "path": ["A", "B", "E"], "edge": ["B", "E"], "note": "Now visit E.", "index": 6}, {"node": "B", "path": ["A", "B"], "edge": ["A", "B"], "note": "Both D and E subtrees are done; visit B.", "index": 7}, {"node": "L", "path": ["A", "C", "F", "L"], "edge": ["F", "L"], "note": "Visit L.", "index": 8}, {"node": "M", "path": ["A", "C", "F", "M"], "edge": ["F", "M"], "note": "Visit M.", "index": 9}, {"node": "F", "path": ["A", "C", "F"], "edge": ["C", "F"], "note": "Visit F.", "index": 10}, {"node": "N", "path": ["A", "C", "G", "N"], "edge": ["G", "N"], "note": "Visit N.", "index": 11}, {"node": "O", "path": ["A", "C", "G", "O"], "edge": ["G", "O"], "note": "Visit O.", "index": 12}, {"node": "G", "path": ["A", "C", "G"], "edge": ["C", "G"], "note": "Visit G.", "index": 13}, {"node": "C", "path": ["A", "C"], "edge": ["A", "C"], "note": "Visit C.", "index": 14}, {"node": "A", "path": ["A"], "edge": null, "note": "Visit the root last in postorder.", "index": 15}];
const BASE_DELAY = 1500;

const $ = id => document.getElementById(id);
const playBtn = $('playBtn');
const stepBtn = $('stepBtn');
const resetBtn = $('resetBtn');
const speedSelect = $('speedSelect');
const speedReadout = $('speedReadout');
const stepNo = $('stepNo');
const totalSteps = $('totalSteps');
const outCount = $('outCount');
const banner = $('banner');
const phaseChip = $('phaseChip');
const phaseNote = $('phaseNote');
const outputNodes = $('outputNodes');
const edgeLayer = $('edgeLayer');
const nodeLayer = $('nodeLayer');

totalSteps.textContent = STEPS.length;

let playing = false;
let timer = null;
let speed = 1;
let stepIndex = -1;
let output = [];

function renderTree(step) {
  const visited = new Set(output);
  const path = new Set(step?.path || []);
  const currentNode = step?.node;
  const activeEdge = step?.edge ? step.edge.join('-') : null;

  edgeLayer.innerHTML = EDGES.map(([p, c]) => {
    const a = NODES[p], b = NODES[c];
    const cls = activeEdge === `${p}-${c}` ? 'tree-edge active' : 'tree-edge';
    return `<line class="${cls}" x1="${a.x}" y1="${a.y+26}" x2="${b.x}" y2="${b.y-26}"></line>`;
  }).join('');

  nodeLayer.innerHTML = Object.entries(NODES).map(([name, pos]) => {
    let cls = 'tree-node idle';
    if (visited.has(name)) cls = 'tree-node visited';
    if (path.has(name) && !visited.has(name)) cls = 'tree-node pending';
    if (name === currentNode) cls = 'tree-node current';
    return `
      <g class="${cls}" transform="translate(${pos.x},${pos.y})">
        <circle r="26"></circle>
        <text y="1">${name}</text>
      </g>
    `;
  }).join('');
}

function renderOutput() {
  outputNodes.innerHTML = output.map((node, idx) => {
    const latest = idx === output.length - 1 ? ' latest' : '';
    return `<div class="out-node${latest}">${node}</div>`;
  }).join('');
  outCount.textContent = output.length;
}

function setBanner(text, kind='') {
  banner.textContent = text;
  banner.className = 'banner' + (kind ? ' ' + kind : '');
}

function renderStep() {
  if (stepIndex < 0) {
    stepNo.textContent = '0';
    phaseChip.innerHTML = 'Phase = <strong>Idle</strong>';
    phaseNote.textContent = 'Left → Right → Root';
    renderTree(null);
    renderOutput();
    setBanner('Press Play');
    return;
  }

  const step = STEPS[stepIndex];
  stepNo.textContent = String(stepIndex + 1);
  phaseChip.innerHTML = `Phase = <strong>Visit</strong>`;
  phaseNote.textContent = step.note;
  renderTree(step);
  renderOutput();
  setBanner(`Visit ${step.node} and append to output`, 'visit');
}

function nextStep() {
  if (stepIndex >= STEPS.length - 1) {
    stop();
    setBanner('Traversal complete', 'done');
    phaseChip.innerHTML = 'Phase = <strong>Done</strong>';
    phaseNote.textContent = 'Final output: ' + output.join(', ');
    return;
  }
  stepIndex += 1;
  const step = STEPS[stepIndex];
  if (!output.includes(step.node)) output.push(step.node);
  renderStep();

  if (stepIndex >= STEPS.length - 1) {
    setTimeout(() => {
      stop();
      setBanner('Traversal complete', 'done');
      phaseChip.innerHTML = 'Phase = <strong>Done</strong>';
      phaseNote.textContent = 'Final output: ' + output.join(', ');
    }, 250 / speed);
  }
}

function currentDelay() {
  return BASE_DELAY / speed;
}

function schedulePlayback() {
  if (timer) clearInterval(timer);
  timer = setInterval(nextStep, currentDelay());
}

function start() {
  if (stepIndex >= STEPS.length - 1) reset();
  playing = true;
  playBtn.textContent = '❚❚ Pause';
  nextStep();
  schedulePlayback();
}

function stop() {
  playing = false;
  playBtn.textContent = '▶ Play';
  if (timer) {
    clearInterval(timer);
    timer = null;
  }
}

function reset() {
  stop();
  speed = Number(speedSelect.value || 1);
  speedReadout.textContent = `${speed}×`;
  stepIndex = -1;
  output = [];
  renderStep();
}

playBtn.addEventListener('click', () => playing ? stop() : start());
stepBtn.addEventListener('click', () => {
  stop();
  nextStep();
});
resetBtn.addEventListener('click', reset);
speedSelect.addEventListener('change', () => {
  speed = Number(speedSelect.value);
  speedReadout.textContent = `${speed}×`;
  if (playing) schedulePlayback();
});

reset();
</script>
</body>
</html>
